<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura del ejemplo: el navegador entra por el puerto 5000 al servicio web, que habla con el servicio redis por una red de Compose; redis guarda datos en un volumen">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="940" height="470" fill="#fff"/>
<text x="470.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Docker Compose: app + Redis</text>
<rect x="30" y="100" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="105.0" y="132.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Tu equipo</text>
<text x="105.0" y="148.0" text-anchor="middle" font-size="11.5" fill="#374151">curl / navegador</text>
<rect x="240" y="56" width="670" height="330" rx="10" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="252" y="76" text-anchor="start" font-size="12" fill="#2563eb" font-weight="bold">compose.yaml  →  docker compose up</text>
<rect x="270" y="120" width="210" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="375.0" y="164.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">web</text>
<text x="375.0" y="181.5" text-anchor="middle" font-size="11.5" fill="#374151">build: .  (Dockerfile)</text>
<text x="375.0" y="197.5" text-anchor="middle" font-size="11.5" fill="#374151">Flask · puerto 5000</text>
<rect x="650" y="120" width="210" height="110" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="755.0" y="164.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">redis</text>
<text x="755.0" y="181.5" text-anchor="middle" font-size="11.5" fill="#374151">image: redis:7-alpine</text>
<text x="755.0" y="197.5" text-anchor="middle" font-size="11.5" fill="#374151">contador de visitas</text>
<rect x="650" y="290" width="210" height="70" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="755.0" y="321.25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">volumen datos-redis</text>
<text x="755.0" y="335.75" text-anchor="middle" font-size="11.5" fill="#374151">los datos sobreviven</text>
<path d="M180 135 L268 135" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="212" y="124" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">5000:5000</text>
<path d="M480 175 L648 175" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="564" y="163" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">red de Compose</text>
<text x="564" y="194" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic">host = "redis"</text>
<path d="M755 232 L755 288" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="785" y="266" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">/data</text>
<text x="40" y="430" text-anchor="start" font-size="12.5" fill="#111827" font-weight="bold">Un solo comando levanta y conecta todo:   docker compose up -d --build</text>
<text x="40" y="452" text-anchor="start" font-size="12" fill="#6b7280" font-style="italic">down conserva el volumen · down -v lo borra</text>
</svg>