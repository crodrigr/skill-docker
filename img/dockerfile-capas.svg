<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Cada instrucción del Dockerfile genera una capa; las primeras se reutilizan de la caché y solo se rehace la del código cuando cambia">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="960" height="440" fill="#fff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Del Dockerfile a las capas de la imagen</text>
<text x="40" y="62" text-anchor="start" font-size="13" fill="#4f46e5" font-weight="bold">Dockerfile</text>
<text x="520" y="62" text-anchor="start" font-size="13" fill="#d97706" font-weight="bold">Capas de la imagen</text>
<rect x="40" y="80" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="106.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="106" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">FROM python:3.12-slim</text>
<rect x="520" y="80" width="260" height="42" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="650.0" y="106.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="106" text-anchor="start" font-size="12.5" fill="#111827">Capa base: Python</text>
<path d="M372 101 L518 101" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="795" y="106" text-anchor="start" font-size="11.5" fill="#15803d" font-weight="bold">CACHÉ</text>
<rect x="40" y="132" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="158.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="158" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">WORKDIR /app</text>
<rect x="520" y="132" width="260" height="42" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="650.0" y="158.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="158" text-anchor="start" font-size="12.5" fill="#111827">Carpeta de trabajo</text>
<path d="M372 153 L518 153" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="795" y="158" text-anchor="start" font-size="11.5" fill="#15803d" font-weight="bold">CACHÉ</text>
<rect x="40" y="184" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="210.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="210" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">COPY requirements.txt .</text>
<rect x="520" y="184" width="260" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="650.0" y="210.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="210" text-anchor="start" font-size="12.5" fill="#111827">Archivo de dependencias</text>
<path d="M372 205 L518 205" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="795" y="210" text-anchor="start" font-size="11.5" fill="#15803d" font-weight="bold">CACHÉ</text>
<rect x="40" y="236" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="262.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="262" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">RUN pip install -r …</text>
<rect x="520" y="236" width="260" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="650.0" y="262.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="262" text-anchor="start" font-size="12.5" fill="#111827">Dependencias instaladas</text>
<path d="M372 257 L518 257" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="795" y="262" text-anchor="start" font-size="11.5" fill="#15803d" font-weight="bold">CACHÉ</text>
<rect x="40" y="288" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="314.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="314" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">COPY app.py .</text>
<rect x="520" y="288" width="260" height="42" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="650.0" y="314.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="314" text-anchor="start" font-size="12.5" fill="#111827">Tu código</text>
<path d="M372 309 L518 309" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="795" y="314" text-anchor="start" font-size="11.5" fill="#c2410c" font-weight="bold">SE REHACE si cambia</text>
<rect x="40" y="340" width="330" height="42" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="205.0" y="366.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="55" y="366" text-anchor="start" font-size="13" fill="#111827" font-weight="bold">CMD ["python","app.py"]</text>
<rect x="520" y="340" width="260" height="42" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="650.0" y="366.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827"></text>
<text x="535" y="366" text-anchor="start" font-size="12.5" fill="#111827">Comando de arranque (metadato)</text>
<path d="M372 361 L518 361" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="420" text-anchor="start" font-size="12" fill="#374151" font-style="italic">Las dependencias van ANTES que el código: cambia poco → se reutiliza; cambia mucho → va al final.</text>
</svg>