<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Flujo: Docker Hub entrega una imagen con docker pull; de la imagen se crean varios contenedores con docker run; un Dockerfile genera una imagen con docker build">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="940" height="380" fill="#fff"/>
<text x="470.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Imagen, contenedor y Docker Hub</text>
<rect x="30" y="60" width="190" height="110" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="125.0" y="104.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Docker Hub</text>
<text x="125.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#374151">registro de imágenes</text>
<text x="125.0" y="137.5" text-anchor="middle" font-size="11.5" fill="#374151">nginx · python · mysql…</text>
<rect x="330" y="60" width="200" height="110" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="430.0" y="104.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Imagen</text>
<text x="430.0" y="121.5" text-anchor="middle" font-size="11.5" fill="#374151">plantilla de solo lectura</text>
<text x="430.0" y="137.5" text-anchor="middle" font-size="11.5" fill="#374151">hecha de capas</text>
<rect x="700" y="60" width="210" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="805.0" y="92.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Contenedor 1</text>
<text x="805.0" y="108.0" text-anchor="middle" font-size="11.5" fill="#374151">instancia en ejecución</text>
<rect x="700" y="150" width="210" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="805.0" y="190.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Contenedor 2</text>
<rect x="700" y="240" width="210" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="805.0" y="280.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Contenedor 3</text>
<path d="M220 115 L328 115" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="274" y="104" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker pull</text>
<path d="M530 100 L600 100 L600 95 L698 95" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="620" y="84" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker run</text>
<path d="M530 115 L600 115 L600 185 L698 185" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M530 130 L600 130 L600 275 L698 275" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="250" width="200" height="90" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="430.0" y="292.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Dockerfile</text>
<text x="430.0" y="309.5" text-anchor="middle" font-size="11.5" fill="#374151">la receta de la imagen</text>
<path d="M430 250 L430 172" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="490" y="215" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker build</text>
<text x="450" y="365" text-anchor="middle" font-size="12" fill="#374151" font-style="italic">De UNA imagen salen MUCHOS contenedores. Borrar un contenedor no borra la imagen.</text>
</svg>