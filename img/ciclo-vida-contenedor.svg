<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Estados de un contenedor: imagen, en ejecución, detenido y borrado, con los comandos que cambian de un estado a otro">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="960" height="260" fill="#fff"/>
<text x="480.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Ciclo de vida de un contenedor</text>
<rect x="30" y="80" width="150" height="70" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="105.0" y="112.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Imagen</text>
<text x="105.0" y="129.5" text-anchor="middle" font-size="11.5" fill="#374151">docker pull</text>
<rect x="270" y="80" width="170" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="355.0" y="112.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">En ejecución</text>
<text x="355.0" y="129.5" text-anchor="middle" font-size="11.5" fill="#374151">docker ps</text>
<rect x="530" y="80" width="160" height="70" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="610.0" y="112.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Detenido</text>
<text x="610.0" y="129.5" text-anchor="middle" font-size="11.5" fill="#374151">docker ps -a</text>
<rect x="780" y="80" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="855.0" y="120.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Borrado</text>
<path d="M180 115 L268 115" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="224" y="104" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker run</text>
<path d="M440 105 L528 105" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="484" y="94" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker stop</text>
<path d="M690 115 L778 115" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<text x="734" y="104" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker rm</text>
<path d="M610 152 L610 205 L355 205 L355 152" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="482" y="198" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="bold">docker start</text>
<text x="355" y="238" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic">docker logs · docker exec -it  (mientras está en ejecución)</text>
</svg>